name: Publish TravelPal.now and daily previews
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 0 * * *'
      timezone: America/Los_Angeles
    - cron: '47 6 * * *'
      timezone: America/Los_Angeles
    - cron: '30 7 * * *'
      timezone: America/Los_Angeles
    - cron: '0 9 * * 6'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without deploying
        type: boolean
        default: true
      newsletter_test:
        description: Send the weekly cloud preview to the two configured owner addresses
        type: boolean
        default: false
      newsletter_preview:
        description: Prepare owner newsletter preview fields without sending email
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: travelpal-pages
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify routes and automation
        run: |
          bash tests/check_routes.sh
          python3 -m unittest discover -s tests -v
      - name: Synchronize finalized travel editions
        id: briefs
        if: vars.TRAVEL_BRIEFS_ENABLED == 'true'
        continue-on-error: true
        run: python3 scripts/daily_travel_brief.py --sync
      - name: Persist edition archive before publication
        if: >-
          vars.TRAVEL_BRIEFS_ENABLED == 'true' && steps.briefs.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          TRAVEL_BRIEF_PERSIST_ENABLED: 'true'
        run: python3 scripts/persist_travel_briefs.py
      - name: Build synchronized daily previews and archived news briefs
        run: python3 scripts/build_site.py
      - name: Compile seven-day newsletter draft without sending
        env:
          FREEZE_WEEKLY_ISSUE: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6') || (github.event_name == 'workflow_dispatch' && (inputs.newsletter_test || inputs.newsletter_preview)) }}
        run: |
          if [ "$FREEZE_WEEKLY_ISSUE" = "true" ]; then
            python3 scripts/weekly_digest.py --web-output dist/weekly --freeze-issue
          else
            python3 scripts/weekly_digest.py --web-output dist/weekly
          fi
      - name: Persist stable newsletter article links before deployment
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          TRAVEL_BRIEF_PERSIST_ENABLED: 'true'
        run: python3 scripts/persist_travel_briefs.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-newsletter-draft
          path: weekly-drafts/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deploy
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        uses: actions/deploy-pages@v4
      - name: Verify live teaser matches DongDong
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import sys
          sys.path.insert(0, 'scripts')
          from daily_exercise import load_current
          data = load_current(datetime.now(ZoneInfo('America/Los_Angeles')).date(), verify_travelpal=True)
          print('Verified live synchronization:', data['releaseId'])
          PY
      - name: Verify newly deployed brief
        if: >-
          vars.TRAVEL_BRIEFS_ENABLED == 'true' && steps.briefs.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          python3 - <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'scripts')
          from daily_travel_brief import load_editions, load_live
          from pathlib import Path
          day = datetime.now(ZoneInfo('America/Los_Angeles')).date()
          editions = load_editions(Path('data/travel-briefs'))
          if any(e['editionId'] == day.isoformat() and e['status'].startswith('ready') and any(s.get('active', True) for s in e['stories']) for e in editions):
              print('Verified live brief:', load_live(day)['editionId'])
          else:
              print('No new article to verify; archived editions retained')
          PY
      - name: Send Saturday weekly edit through EmailOctopus
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6' &&
          vars.WEEKLY_NEWSLETTER_ENABLED == 'true'
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
        run: python3 scripts/weekly_sender.py --send
      - name: Send explicitly requested owner preview
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.newsletter_test == true &&
          inputs.dry_run == false
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          EMAILOCTOPUS_TEST_CONTACT_IDS: ${{ secrets.EMAILOCTOPUS_TEST_CONTACT_IDS }}
        run: python3 scripts/weekly_sender.py --send --test
      - name: Prepare owner newsletter preview without sending
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.newsletter_preview == true &&
          inputs.dry_run == false
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          EMAILOCTOPUS_TEST_CONTACT_IDS: ${{ secrets.EMAILOCTOPUS_TEST_CONTACT_IDS }}
        run: python3 scripts/weekly_sender.py --prepare-test
