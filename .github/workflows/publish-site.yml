name: Publish TravelPal.now and daily previews
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 0 * * *'
      timezone: America/Los_Angeles
    - cron: '47 6 * * *'
      timezone: America/Los_Angeles
    - cron: '30 7 * * *'
      timezone: America/Los_Angeles
    - cron: '0 9 * * 6'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without deploying
        type: boolean
        default: true
      newsletter_test:
        description: Send the weekly cloud preview to the two configured owner addresses
        type: boolean
        default: false
      newsletter_preview:
        description: Prepare owner newsletter preview fields without sending email
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: travelpal-pages
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify routes and automation
        run: |
          bash tests/check_routes.sh
          python3 -m unittest discover -s tests -v
      - name: Synchronize finalized travel editions
        id: briefs
        if: vars.TRAVEL_BRIEFS_ENABLED == 'true'
        continue-on-error: true
        run: python3 scripts/daily_travel_brief.py --sync
      - name: Find openly licensed Wikimedia Commons story photos
        if: vars.TRAVEL_BRIEFS_ENABLED == 'true' && steps.briefs.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/story_photos.py
      - name: Persist edition archive before publication
        if: >-
          vars.TRAVEL_BRIEFS_ENABLED == 'true' && steps.briefs.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          TRAVEL_BRIEF_PERSIST_ENABLED: 'true'
        run: python3 scripts/persist_travel_briefs.py
      - name: Build synchronized daily previews and archived news briefs
        env:
          # A merge after midnight Pacific can land before DongDong publishes the new day's lesson.
          ALLOW_PREVIOUS_DAY: ${{ github.event_name == 'push' }}
        run: |
          args=()
          if [ "$ALLOW_PREVIOUS_DAY" = "true" ]; then args+=(--allow-previous-day); fi
          python3 scripts/build_site.py "${args[@]}"
      - name: Compile seven-day newsletter draft without sending
        env:
          FREEZE_WEEKLY_ISSUE: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6') || (github.event_name == 'workflow_dispatch' && inputs.newsletter_preview) }}
          FREEZE_TEST_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.newsletter_test }}
        run: |
          args=(--web-output dist/weekly)
          if [ "$FREEZE_WEEKLY_ISSUE" = "true" ]; then args+=(--freeze-issue); fi
          if [ "$FREEZE_TEST_ISSUE" = "true" ]; then args+=(--freeze-test-issue "test-$GITHUB_RUN_ID"); fi
          python3 scripts/weekly_digest.py "${args[@]}"
      - name: Persist stable newsletter article links before deployment
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          TRAVEL_BRIEF_PERSIST_ENABLED: 'true'
        run: python3 scripts/persist_travel_briefs.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-newsletter-draft
          path: weekly-drafts/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deploy
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        uses: actions/deploy-pages@v4
      - name: Verify live teaser matches DongDong
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from datetime import date
          import json
          import sys
          import time
          sys.path.insert(0, 'scripts')
          from daily_exercise import load_current
          # Verify the day that was built, which a push build may have kept from yesterday.
          day = date.fromisoformat(json.loads(open('dist/dongdong/daily-exercise.json').read())['date'])
          # Pages can keep serving the previous deployment for a few minutes after deploy-pages reports success.
          for attempt in range(1, 11):
              try:
                  data = load_current(day, verify_travelpal=True)
                  print('Verified live synchronization:', data['releaseId'])
                  break
              except (OSError, ValueError) as error:
                  if attempt == 10:
                      raise
                  print(f'Attempt {attempt}: {error}; retrying in 30s')
                  time.sleep(30)
          PY
      - name: Verify newly deployed brief
        if: >-
          vars.TRAVEL_BRIEFS_ENABLED == 'true' && steps.briefs.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          python3 - <<'PY'
          import sys
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'scripts')
          from daily_travel_brief import load_editions, load_live
          from pathlib import Path
          day = datetime.now(ZoneInfo('America/Los_Angeles')).date()
          editions = load_editions(Path('data/travel-briefs'))
          if any(e['editionId'] == day.isoformat() and e['status'].startswith('ready') and any(s.get('active', True) for s in e['stories']) for e in editions):
              # Pages can keep serving the previous deployment for a few minutes after deploy-pages reports success.
              for attempt in range(1, 11):
                  try:
                      print('Verified live brief:', load_live(day)['editionId'])
                      break
                  except (OSError, ValueError) as error:
                      if attempt == 10:
                          raise
                      print(f'Attempt {attempt}: {error}; retrying in 30s')
                      time.sleep(30)
          else:
              print('No new article to verify; archived editions retained')
          PY
      - name: Send Saturday weekly edit through EmailOctopus
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6' &&
          vars.WEEKLY_NEWSLETTER_ENABLED == 'true'
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
        run: python3 scripts/weekly_sender.py --send
      - name: Send explicitly requested owner preview
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.newsletter_test == true &&
          inputs.dry_run == false
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          EMAILOCTOPUS_TEST_CONTACT_IDS: ${{ secrets.EMAILOCTOPUS_TEST_CONTACT_IDS }}
          WEEKLY_TEST_ISSUE: test-${{ github.run_id }}
        run: python3 scripts/weekly_sender.py --send --test
      - name: Prepare owner newsletter preview without sending
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.newsletter_preview == true &&
          inputs.dry_run == false
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          EMAILOCTOPUS_TEST_CONTACT_IDS: ${{ secrets.EMAILOCTOPUS_TEST_CONTACT_IDS }}
        run: python3 scripts/weekly_sender.py --prepare-test
